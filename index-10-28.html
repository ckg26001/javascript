<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <script>

        function showSeiseki(){
            var item = document.getElementById( "v").value;
            // alert ( item*1 + 1 );
        
            if( item*1 < 44)
                alert( "grade 1");
            else if( item*1 < 50)       
                alert( "grade 2");
            else if( item*1 < 70)
                 alert( "grade 3");
            else              
                 alert( "grade 4");    
        }
        function showSeiseki2(){
            // - 2      ・・・単項演算子
            // 2 + 3    ・・・2項演算子

            var item = document.getElementById( "v").value;

            //　条件式　? Yesの結果：Noの結果
            var ret = item*1 < 44 ? true : false  ;

            if( item*1 <44 ){
                ret = true;
            }else{
                ret = false;
            }

            alert( ret);

        }
    </script>
</head>
<body>
    <input type="text" name="v" id="v">
    <button onclick="showSeiseki()"> 成績評価</button>
    <button onclick="showSeiseki2()">三項演算子で成績評価</button>

    <script>

        for ( var i =0; i < 10; i++ ){
                document.write("この一行を繰り返します。<br>");
            }

        for ( var j = 10 ; j == 0 ; j-- ){
            document.write( "カウントダウン型繰り返し");
        }
    </script>
</body>
</html>
